<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Consumo Mensual</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f6f9; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-bottom: 5px; }
        .sub { color: #7f8c8d; margin-bottom: 20px; font-size: 0.95rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #3498db; color: white; }
        tr:hover { background-color: #f9f9f9; }
        .badge-consumo { background-color: #2ecc71; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.9em; }
        .badge-toner { background-color: #9b59b6; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.9em; }
        .sin-datos { color: #95a5a6; font-style: italic; }
        .badge-error { background-color: #e74c3c; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.9em; }
        select { padding: 8px 12px; border-radius: 4px; border: 1px solid #bdc3c7; font-size: 1rem; margin-bottom: 15px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Control de Consumo e Impresión</h1>
        <div class="sub" id="actualizacion">Cargando datos desde GitHub...</div>
        
        <label for="selector-mes"><strong>Seleccionar Mes a Analizar: </strong></label>
        <select id="selector-mes" onchange="renderizarTabla()"></select>

        <table>
            <thead>
                <tr>
                    <th>Impresora</th>
                    <th>Dirección IP</th>
                    <th>Métrica</th>
                    <th>Valor Actual</th>
                    <th>Estado / Consumo Mensual</th>
                </tr>
            </thead>
            <tbody id="tabla-cuerpo">
                <tr>
                    <td colspan="5" style="text-align: center; color: #7f8c8d;">Buscando registros...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        let datosHistorial = {};

        // === CONFIGURACIÓN DE RUTAS MÓVILES ===
        const GITHUB_USER = "LautyMel";
        const GITHUB_REPO = "Impresoras";
        const urlJson = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/historial_impresoras.json`;

        // 1. Cargar el JSON dinámico saltando la caché del navegador
        fetch(`${urlJson}?t=${new Date().getTime()}`)
            .then(response => {
                if (!response.ok) throw new Error("No se pudo obtener el JSON");
                return response.json();
            })
            .then(data => {
                datosHistorial = data;
                
                const meses = Object.keys(data).sort().reverse();
                if (meses.length === 0) {
                    document.getElementById('actualizacion').innerText = "El archivo de historial está vacío.";
                    return;
                }

                const selector = document.getElementById('selector-mes');
                selector.innerHTML = ""; 

                meses.forEach(mes => {
                    const opt = document.createElement('option');
                    opt.value = mes;
                    opt.innerText = traducirMes(mes);
                    selector.appendChild(opt);
                });

                renderizarTabla();
            })
            .catch(err => {
                console.error(err);
                document.getElementById('actualizacion').innerHTML = "<span style='color: #e74c3c; font-weight: bold;'>Error: No se pudo conectar con los datos de GitHub. Revisa el usuario y repositorio.</span>";
            });

        // 2. Función para calcular diferencias y construir la interfaz
        function renderizarTabla() {
            const selector = document.getElementById('selector-mes');
            if (!selector || !selector.value) return;

            const mesSeleccionado = selector.value;
            const cuerpo = document.getElementById('tabla-cuerpo');
            cuerpo.innerHTML = ""; 

            if (!datosHistorial[mesSeleccionado]) return;

            document.getElementById('actualizacion').innerText = `Última lectura de este mes: ${datosHistorial[mesSeleccionado].ultima_actualizacion}`;

            const [year, month] = mesSeleccionado.split('-').map(Number);
            const fechaMesAnterior = new Date(year, month - 2, 1);
            const mesAnteriorClave = fechaMesAnterior.getFullYear() + "-" + String(fechaMesAnterior.getMonth() + 1).padStart(2, '0');

            const datosActuales = datosHistorial[mesSeleccionado].datos;
            const datosAnteriores = datosHistorial[mesAnteriorClave] ? datosHistorial[mesAnteriorClave].datos : null;

            for (const [nombreImp, info] of Object.entries(datosActuales)) {
                for (const [metrica, valorContador] of Object.entries(info)) {
                    if (metrica === 'ip') continue;

                    let celdaDiferencia = `<span class="sin-datos">Esperando datos...</span>`;
                    let contadorMostrar = "";

                    if (valorContador === "ERROR" || valorContador === undefined) {
                        contadorMostrar = `<span class="badge-error">OFFLINE</span>`;
                        celdaDiferencia = `<span class="sin-datos">—</span>`;
                    } else {
                        contadorMostrar = Number(valorContador).toLocaleString();

                        // LÓGICA PASADA SEGÚN LA MÉTRICA
                        if (metrica === "Nivel de Tóner") {
                            contadorMostrar = `${valorContador}`; 
                            celdaDiferencia = `<span class="badge-toner">Lectura Directa</span>`;
                        } else if (metrica === "Contador General") {
                            celdaDiferencia = `<span class="sin-datos">Esperando al próximo mes...</span>`;
                            if (datosAnteriores && datosAnteriores[nombreImp] && datosAnteriores[nombreImp][metrica]) {
                                const valorAnterior = datosAnteriores[nombreImp][metrica];
                                if (valorAnterior !== "ERROR" && valorAnterior !== undefined) {
                                    const diferencia = Number(valorContador) - Number(valorAnterior);
                                    celdaDiferencia = `<span class="badge-consumo">+ ${diferencia.toLocaleString()} hojas</span>`;
                                }
                            }
                        }
                    }

                    cuerpo.innerHTML += `
                        <tr>
                            <td><strong>${nombreImp}</strong></td>
                            <td>${info.ip || 'Sin IP'}</td>
                            <td>${metrica}</td>
                            <td>${contadorMostrar}</td>
                            <td>${celdaDiferencia}</td>
                        </tr>`;
                }
            }
        }

        function traducirMes(mesClave) {
            const [year, month] = mesClave.split('-');
            const nombres = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            return `${nombres[parseInt(month) - 1]} ${year}`;
        }
    </script>
</body>
</html>
